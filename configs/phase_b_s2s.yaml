# Phase B — S2S avec tool au milieu (boucle complète, réponse PARLÉE).
# Données : dialogues multi-tours generes en mode loop puis TTS user + assistant :
#   python scripts/generate_toolcalling_data.py --mode loop --output data/tc_en_s2s.jsonl --n-total 3000 ...
#   python scripts/synthesize_user_audio.py --engine voxtral --voices <user voices> \
#       --assistant-voice neutral_female --dialogues data/tc_en_s2s.jsonl ...
#   python -m s2s_toolcalling.data.preprocess_sft --assistant-audio-mode INTERLEAVED \
#       --interleaved-text-tokens 6 --interleaved-audio-tokens 12 --tool-definitions tools_en.json ...
#
# Le tour TOOL-CALL est TEXTE SEUL ; le tour RÉPONSE est INTERLEAVED (parole S2S
# basse latence). À l'inférence l'orchestrateur est HYBRIDE : generate_sequential
# pour le tour tool-call (texte propre, pas d'interleave forcé qui le
# shredderait) puis generate_interleaved pour parler la réponse ancrée.
# « Penser en texte, parler en audio ». Démo : scripts/s2s_toolcalling_webrtc_demo.py.

model_id: LiquidAI/LFM2.5-Audio-1.5B   # ou l'adaptateur Phase A mergé (export_checkpoint)
train_dataset: datasets/tc_en_s2s_train
val_dataset: datasets/tc_en_s2s_val
context_length: 2048                    # multi-tours + audio → plus long que la Phase A

# LoRA backbone ; encodeur + têtes audio GELÉS : on enseigne QUOI dire (texte ancré
# dans le résultat), pas COMMENT parler — le modèle sait déjà vocaliser (timbre
# préservé). Si UTMOS chute > 0.3 vs vanilla → dégeler freeze_audio_heads.
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05

freeze:
  freeze_encoder: true
  freeze_audio_heads: true

lr: 1.0e-4
max_steps: 2000
warmup_steps: 200
batch_size: 4                           # tours plus longs → batch plus petit
dataloader_num_workers: 4
logging_interval: 10
save_interval: 500
val_interval: 100
output_dir: outputs/phase_b_s2s

grad_clip: 1.0
wandb_project: lfm25-toolcalling-en
wandb_run_name: phase_b_s2s_v1
hub_repo: Rcarvalo/lfm25-tc-en-s2s-adapter
push_interval: 500
