# Déploiement vLLM-Omni de LFM2.5-Audio (plugin vllm_omni_lfm2_audio).
# Modelé sur le mimo_audio.yaml in-tree : 2 stages sur un seul GPU,
# streaming des codes via SharedMemoryConnector (async_chunk).
#
#   vllm-omni serve exports/lfm25_audio_fr_omni \
#       --stage-config-path configs/vllm_omni_lfm2_audio.yaml

async_chunk: true
dtype: bfloat16

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 365536
      codec_streaming: true
      connector_get_sleep_s: 0.001
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      # 12,5 frames/s : 10 frames = 800 ms par chunk émis, ~1 s de contexte gauche.
      # Descendre codec_chunk_frames (min 3) pour réduire le TTFA, au prix de
      # plus d'appels au détokeniseur.
      codec_chunk_frames: 10
      codec_left_context_frames: 13
      # Premier chunk émis dès 2 frames (160 ms d'audio) : borne le TTFA à
      # ~prefill + ~8 steps + détokenisation, pendant que le chunk suivant
      # s'accumule. Même levier que qwen3_tts (1) / fish (4) in-tree.
      initial_codec_chunk_frames: 2

stages:
  - stage_id: 0                      # AR interleaved (backbone + depthformer)
    max_num_seqs: 4                  # continuous batching multi-sessions
    gpu_memory_utilization: 0.6
    # CUDA graphs actifs : vLLM capture le décode des modèles hybrides
    # (ShortConv) en full graph par défaut (PR vllm#22594) — nos hooks
    # preprocess/sample vivent au niveau du runner, HORS du graph.
    # Si la capture échoue ou produit du bruit : repasser à true et ouvrir
    # une issue (cf. docs/optimization_audit.md §1.1).
    enforce_eager: false
    trust_remote_code: true
    # vLLM 0.22 active l'async scheduling PAR DÉFAUT : notre sampler rejoue la
    # modalité depuis output_token_ids, tronqué d'un token in-flight en async
    # (écart 5) → désactivé tant que la compensation n'est pas implémentée
    # (action 6 de docs/optimization_audit.md).
    async_scheduling: false
    # APC DÉSACTIVÉ (mesuré le 12/06 sur Colab, vllm-omni 0.22.0) :
    # le chemin omni_prefix_cache du runner (get_merged_multimodal_states)
    # refait le payload par requête en découpant par tokens schedulés et
    # PERD notre export sparse codes.audio → payload_keys=['hidden'] à
    # chaque step, zéro chunk vers le stage 1 ; il corrompt aussi la
    # génération sur hit de cache (réponse tronquée à 2 frames).
    # De toute façon l'APC hybride (ShortConv) est expérimental et sans
    # effet sous ~528 tokens de préfixe — cf. docs/optimization_audit.md §2.
    # À réessayer quand vllm#26201 / le merge mm sparse seront corrigés.
    enable_prefix_caching: false
    max_num_batched_tokens: 8192
    max_model_len: 32768
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0               # texte greedy (tool calls déterministes) ;
      top_p: 1.0                     # le sampling AUDIO (prosodie) est interne au
      top_k: -1                      # modèle : config audio_temperature/audio_top_k
      max_tokens: 4096

  - stage_id: 1                      # détokeniseur (code2wav)
    max_num_seqs: 4
    gpu_memory_utilization: 0.2
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: false
    max_num_batched_tokens: 8192
    max_model_len: 8192
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 8192
