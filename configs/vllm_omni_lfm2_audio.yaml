# Déploiement vLLM-Omni de LFM2.5-Audio (plugin vllm_omni_lfm2_audio).
# Modelé sur le mimo_audio.yaml in-tree : 2 stages sur un seul GPU,
# streaming des codes via SharedMemoryConnector (async_chunk).
#
#   vllm-omni serve exports/lfm25_audio_fr_omni \
#       --stage-config-path configs/vllm_omni_lfm2_audio.yaml

async_chunk: true
dtype: bfloat16

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 365536
      codec_streaming: true
      connector_get_sleep_s: 0.001
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      # 12,5 frames/s : 10 frames = 800 ms par chunk émis, ~1 s de contexte gauche.
      # Descendre codec_chunk_frames (min 3) pour réduire le TTFA, au prix de
      # plus d'appels au détokeniseur.
      codec_chunk_frames: 10
      codec_left_context_frames: 13

stages:
  - stage_id: 0                      # AR interleaved (backbone + depthformer)
    max_num_seqs: 4                  # continuous batching multi-sessions
    gpu_memory_utilization: 0.6
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: true      # LE gain : tours + tool rounds sans re-prefill
    max_num_batched_tokens: 8192
    max_model_len: 32768
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0               # texte greedy (tool calls déterministes) ;
      top_p: 1.0                     # le sampling AUDIO (prosodie) est interne au
      top_k: -1                      # modèle : config audio_temperature/audio_top_k
      max_tokens: 4096

  - stage_id: 1                      # détokeniseur (code2wav)
    max_num_seqs: 4
    gpu_memory_utilization: 0.2
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: false
    max_num_batched_tokens: 8192
    max_model_len: 8192
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 8192
