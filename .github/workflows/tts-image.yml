# Build the TTS batch image (infra/Dockerfile.tts) and push it to GHCR.
#
# Free CI build: no local Docker, no RunPod build minutes. The base vLLM image
# is large, so the runner's preinstalled toolchains are removed first — without
# that step the job dies on "no space left on device".

name: tts-image

on:
  workflow_dispatch:
  push:
    branches: [rd/pr_rca_eval_baseline, main]
    paths:
      - infra/Dockerfile.tts
      - infra/pod_tts_job.sh
      - infra/pod_synth_fresh.py
      - .github/workflows/tts-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk (the vLLM base image needs the room)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.tts
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lfm2-tts:latest
