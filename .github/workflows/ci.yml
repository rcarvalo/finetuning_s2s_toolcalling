name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      # Sans extras : le CPU du runner n'a ni vLLM ni liquid-audio. Les modules
      # qui en dépendent importent lourd À L'INTÉRIEUR des fonctions — l'import
      # du paquet et les tests non-GPU passent donc sans eux.
      - name: Install project (dev only)
        run: uv sync --group dev

      - name: Format + lint
        run: make lint-check

      - name: Typecheck
        run: make typecheck

      - name: Tests (hors GPU)
        run: uv run pytest -q -m "not gpu" --cov --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --group dev
      # mypy tourne déjà dans le job quality — on évite de le payer deux fois.
      - run: SKIP=mypy uv run pre-commit run --all-files --show-diff-on-failure
