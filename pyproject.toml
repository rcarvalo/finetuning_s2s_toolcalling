[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s2s-toolcalling"
version = "0.1.0"
description = "Phases 2 & 3 : fine-tuning FR + tool calling de LFM2.5-Audio et orchestrateur d'outils (accueil entreprise, Reachy Mini)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Fine-tuning (Phase 2) — liquid-audio impose Python >= 3.12
    "liquid-audio>=1.3.0",
    # <0.15 : peft>=0.15 exige torchao>=0.16, ININSTALLABLE avec le torch de
    # l'env vllm 0.22 → on garde peft 0.14 pour l'ENTRAÎNEMENT. (Voxtral/vllm-omni
    # veut peft>=0.17 via diffusers → incompatible : Phase B TTS via Kokoro à la
    # place, pas de vllm-omni dans l'env d'entraînement.)
    "peft>=0.13,<0.15",
    "accelerate>=1.0",
    "datasets>=3.0",
    "safetensors>=0.4",
    "soundfile>=0.12",
    "torchaudio>=2.4",
    "transformers>=4.55",
    "wandb>=0.18",
]
# Orchestrateur temps réel (Phase 3)
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13.0",
    "asyncpg>=0.29",
    "numpy>=1.26",
]
# RAG projets (Phase 3)
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]
# Génération + TTS du dataset tool-calling EN (offline, hors chemin d'inférence) :
# synthèse LLM (Gemini par défaut, Anthropic en option), TTS Voxtral via vLLM
# (client httpx) ou Kokoro en repli, assemblage + push HF (datasets/hub).
# sentence-transformers (extra rag) sert au scorer d'arguments sémantique.
tooldata = [
    "google-genai>=0.3",
    "anthropic>=0.40",
    "httpx>=0.27",
    "soundfile>=0.12",
    "torchaudio>=2.4",
    "ddgs>=6.0",
    "tavily-python>=0.5",
    "datasets>=3.0",
    "huggingface-hub>=0.25",
    "kokoro>=0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# Plugin vLLM-Omni (serveur S2S optimisé) — GPU, Python >= 3.12
vllm-omni = [
    "vllm-omni>=0.22.0",
    "liquid-audio>=1.3.0",
]

# Chargé par vLLM-Omni dans tous ses process (engine + workers) :
# enregistre l'architecture Lfm2AudioOmniModel et le pipeline lfm2_audio.
[project.entry-points."vllm_omni.general_plugins"]
lfm2_audio = "vllm_omni_lfm2_audio:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "gpu: tests nécessitant un GPU et les checkpoints (désélectionnés par défaut : -m 'not gpu')",
]
