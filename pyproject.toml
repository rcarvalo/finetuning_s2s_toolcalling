[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lfm2-audio"
version = "0.1.0"
description = "Fine-tuning, serving vLLM et orchestration tool-calling de LFM2.5-Audio-1.5B (assistant vocal S2S)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
    # Résolution des checkpoints depuis le Hub : `from_pretrained("org/repo")`
    # est le chemin principal du README, pas une option.
    "huggingface-hub>=0.25",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Serving backend de référence (liquid-audio PyTorch) — GPU, sans vLLM.
# Isolé de `serving` : l'image serverless de validation économise ainsi les
# ~5 Go de vLLM + ses dépendances CUDA.
serving-liquid = [
    "liquid-audio>=1.3.0",
    "huggingface-hub>=0.25",
    "soundfile>=0.12",
    "torchaudio>=2.4",
    "transformers>=4.55",
]
# Serving vLLM-Omni (plugin out-of-tree + wrapper LFM2Audio) — GPU.
serving = [
    "lfm2-audio[serving-liquid]",
    # Pinned, not floating: the out-of-tree plugin is written against the 0.22
    # engine and its documented workarounds (_set_final_only_for_llm_stages,
    # enable_prefix_caching=False) are not known to hold on 0.24+. An unbounded
    # >=0.22.0 resolves to the latest, which then demands a newer vLLM than the
    # one pinned by URL just above it — and the install fails on the conflict.
    "vllm-omni>=0.22,<0.23",
    # Servir un ADAPTATEUR passe par la fusion LoRA, donc par peft. PAS de borne
    # haute ici, contrairement à l'extra `train` : celle-ci vise le torch 2.8 de
    # l'entraînement, alors que vLLM-Omni amène son propre ensemble cohérent
    # (torch 2.11, peft 0.20, torchao 0.10, diffusers 0.38) — vérifié le 26/08.
    # Forcer peft<0.15 ici CASSE cet ensemble.
    "peft>=0.13",
]
# Évaluation : métriques audio (WER via Whisper, DNSMOS, NISQA) et juge LLM.
# Les poids DNSMOS/NISQA ne sont pas redistribuables : chemins dans
# $DNSMOS_MODEL_PATH / $NISQA_MODEL_PATH (cf. docs/evaluation.md).
eval = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "transformers>=4.55",
    "onnxruntime>=1.18",
    "google-genai>=0.3",
    "soundfile>=0.12",
    # ASR CPU du WER (CTranslate2, int8) : le chemin transformers charge Whisper
    # sur cuda:0 et fait déborder un GPU déjà occupé par le modèle audio.
    "faster-whisper>=1.0",
]

# Fine-tuning — liquid-audio impose Python >= 3.12.
# peft <0.15 : peft>=0.15 exige torchao>=0.16, ININSTALLABLE avec le torch de
# l'env vllm 0.22 → on garde peft 0.14 pour l'ENTRAÎNEMENT.
train = [
    "liquid-audio>=1.3.0",
    "peft>=0.13,<0.15",
    "accelerate>=1.0",
    "datasets>=3.0",
    "safetensors>=0.4",
    "soundfile>=0.12",
    "torchaudio>=2.4",
    "transformers>=4.55",
    "wandb>=0.18",
]
# Orchestrateur temps réel (WebSocket / WebRTC).
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13.0",
    "asyncpg>=0.29",
]
# Client de l'endpoint serverless RunPod — léger, sans GPU (Reachy Mini).
client = [
    "httpx>=0.27",
]
# Assistant vocal mains-libres (lfm2-voice) : WebRTC + VAD côté client.
# Torch-free on purpose: the mic capture is sent at its native rate and the
# worker resamples on the GPU, so the app runs on a laptop or a Reachy Mini.
voice = [
    "lfm2-audio[client]",
    "fastrtc[vad]>=0.0.20",
    # Transcribes the capture so the user can see what was actually heard.
    # faster-whisper runs on CPU through CTranslate2 — no torch, so the extra
    # stays deployable on a laptop or a Reachy Mini.
    "faster-whisper>=1.0",
]
# App Gradio de test de l'endpoint serverless (app/gradio_app.py).
app = [
    "gradio>=5.0",
    "httpx>=0.27",
]
# Export d'une campagne vers le viewer Inspect AI : sa liste filtrable, son
# détail par échantillon et son lecteur audio (`ContentAudio` en data URI)
# valent mieux qu'un viewer maison. Optionnel : rien ne l'importe hors export.
inspect = [
    "inspect-ai>=0.3",
]
# Base de connaissances RAG.
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]
# Génération + TTS du dataset tool-calling (offline, hors chemin d'inférence).
tooldata = [
    "google-genai>=0.3",
    "anthropic>=0.40",
    "httpx>=0.27",
    "soundfile>=0.12",
    "torchaudio>=2.4",
    "ddgs>=6.0",
    "tavily-python>=0.5",
    "datasets>=3.0",
    "huggingface-hub>=0.25",
    "kokoro>=0.9",
]

[project.scripts]
lfm2-demo = "lfm2_audio.cli.serve.demo_s2s:main"
lfm2-bench = "lfm2_audio.cli.eval.latency:main"
lfm2-smoke = "lfm2_audio.cli.serve.smoke_vllm:main"
lfm2-evaluate = "lfm2_audio.cli.eval.suite:main"
lfm2-bench-app = "lfm2_audio.cli.serve.bench:main"
lfm2-voice = "lfm2_audio.cli.serve.voice:main"
lfm2-eval-audio = "lfm2_audio.cli.eval.audio_toolcall:main"
lfm2-eval-toolcalling = "lfm2_audio.cli.eval.toolcall:main"
lfm2-eval-compare = "lfm2_audio.cli.eval.compare:main"
lfm2-eval-rescore = "lfm2_audio.cli.eval.rescore:main"
lfm2-eval-inspect = "lfm2_audio.cli.eval.inspect_export:main"
lfm2-eval-versa = "lfm2_audio.cli.eval.versa_pass:main"
lfm2-toolcalling-demo = "lfm2_audio.cli.serve.demo_toolcall:main"
lfm2-orchestrator-demo = "lfm2_audio.cli.serve.demo_orchestrator:main"
lfm2-convert-checkpoint = "lfm2_audio.cli.serve.convert_omni:main"
lfm2-export-checkpoint = "lfm2_audio.cli.train.export:main"
lfm2-preprocess-sft = "lfm2_audio.cli.data.pack_sft:main"
lfm2-train-sft = "lfm2_audio.cli.train.sft:main"
lfm2-generate-data = "lfm2_audio.cli.data.generate:main"
lfm2-synthesize-audio = "lfm2_audio.cli.data.synthesize:main"
lfm2-build-dataset = "lfm2_audio.cli.data.push_hf:main"
lfm2-analyze-dataset = "lfm2_audio.cli.data.analyze:main"
lfm2-hf-to-dialogues = "lfm2_audio.cli.data.pull_hf:main"
lfm2-asr-bench = "lfm2_audio.cli.data.make_asr_bench:main"
lfm2-fr-audit = "lfm2_audio.cli.data.audit_fr_sources:main"
lfm2-dataset-inventory = "lfm2_audio.cli.data.inventory:main"
lfm2-dataset-curate = "lfm2_audio.cli.data.curate:main"
lfm2-dataset-repack = "lfm2_audio.cli.data.repack:main"
lfm2-prepare-fr = "lfm2_audio.cli.data.prepare_fr:main"
lfm2-calibrate = "lfm2_audio.cli.train.calibrate_ratio:main"
lfm2-rag-ingest = "lfm2_audio.cli.data.rag_ingest:main"
lfm2-serve-ws = "lfm2_audio.cli.serve.websocket:main"

# Chargé par vLLM-Omni dans TOUS ses process (engine + workers) :
# enregistre l'architecture Lfm2AudioOmniModel et le pipeline lfm2_audio.
[project.entry-points.inspect_ai]
# Inspect imports this module at startup so `--model lfm2/…` resolves from the
# CLI — without it the @modelapi registration only exists when our own code
# already imported the provider.
lfm2_audio = "lfm2_audio.inspect_bridge.provider"

[project.entry-points."vllm_omni.general_plugins"]
lfm2_audio = "lfm2_audio.vllm_plugin:register"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Lecture/écriture WAV : testée en CI, sans GPU ni extra `serving`.
    "soundfile>=0.12",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    # Client remote : testé via httpx.MockTransport, sans réseau.
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.11",
    "pre-commit>=4.0",
    "nbstripout>=0.7",
    "types-PyYAML>=6.0",
    "ipykernel>=6.29",
]

[tool.hatch.build.targets.wheel]
packages = ["python/lfm2_audio"]

[tool.uv]
package = true

# --------------------------------------------------------------------------- #
# Qualité
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["python", "tests"]
# Notebooks : exploration uniquement (règle projet). Ni lintés ni formatés —
# nbstripout en pre-commit s'occupe de leurs sorties.
extend-exclude = ["notebooks", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PL", "PT", "ANN"]
ignore = [
    "PLR0913",  # too many args : courant en ML (hyperparamètres)
    "PLR2004",  # magic values : les constantes audio (24000, 16000) se lisent mieux nues
    "B008",     # appels en défaut d'argument : idiome argparse/pydantic
    # Les imports lourds (torch, vllm, liquid_audio) sont volontairement placés
    # DANS les fonctions : `import lfm2_audio` doit rester utilisable sur une
    # machine sans GPU, et le plugin est chargé dans chaque worker vLLM.
    "PLC0415",
    # Docstrings et messages en français : apostrophes et guillemets typographiques.
    "RUF001", "RUF002", "RUF003",
    # Métriques de complexité : elles signalent surtout les `main()` d'argparse et
    # les forwards de modèles, où découper nuirait à la lisibilité. Les vraies
    # limites du projet (fonctions < 50 l., classes < 200 l.) sont dans CLAUDE.md.
    "PLR0911", "PLR0912", "PLR0915", "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["ALL"]
# Les tests s'écrivent avec des assertions composées et des variables de
# déballage inutilisées : lisible ici, et sans conséquence à l'exécution.
"tests/*" = ["ANN", "PLR2004", "S101", "PT006", "PT018", "PT015", "PT017", "B011", "RUF059", "N801"]
# Surface d'API non typée en amont (vLLM, vLLM-Omni, liquid-audio, torch) :
# annoter `Any` y est la description honnête, pas un raccourci.
# Modules qui manipulent des objets non typés en amont — torch `nn.Module`,
# classes vLLM/vLLM-Omni, `Trainer` liquid-audio, handlers FastAPI. Y écrire
# `Any` partout serait du bruit sans information ; le typage reste exigé sur
# tout le reste du paquet (core, ds, serving, evaluation).
"python/lfm2_audio/vllm_plugin/*" = ["ANN401", "ANN001", "ANN201", "ANN202", "ANN003", "ANN002", "ANN206"]
"python/lfm2_audio/training/*" = ["ANN401", "ANN001", "ANN201", "ANN202", "ANN003", "ANN002", "ANN205"]
"python/lfm2_audio/orchestrator/server.py" = ["ANN001", "ANN201", "ANN202"]
# `Any` honnête : payload JSON d'outil, pool asyncpg, littéral parsé.
"python/lfm2_audio/tools/*" = ["ANN401"]
"python/lfm2_audio/orchestrator/tool_parser.py" = ["ANN401"]
"python/lfm2_audio/serving/backends/*" = ["ANN401"]
"python/lfm2_audio/cli/**/*.py" = ["ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["python/lfm2_audio"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true

# Le serving et l'entraînement s'appuient sur des libs non typées : on relâche
# là où le typage externe manque, pas ailleurs.
[[tool.mypy.overrides]]
module = [
    "vllm.*", "vllm_omni.*", "liquid_audio.*", "torch.*", "torchaudio.*",
    "transformers.*", "peft.*", "datasets.*", "safetensors.*",
    "soundfile.*", "soxr.*", "chromadb.*",
    "gradio.*", "fastrtc.*", "wandb.*", "kokoro.*", "ddgs.*", "tavily.*", "faster_whisper.*",
    "google.*", "anthropic.*", "asyncpg.*",
    "huggingface_hub.*", "uvicorn.*", "fastapi.*", "httpx.*", "onnxruntime.*", "pyarrow.*",
]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# Dette de typage — modules antérieurs à la mise sous `mypy --strict`.
#
# `strict` tient sur le cœur du paquet (core, ds, serving, evaluation) : c'est
# vérifié en CI et ne doit pas régresser. Les modules ci-dessous manipulent
# massivement des objets non typés en amont (couches vLLM, `nn.Module` torch,
# `Trainer` liquid-audio, handlers FastAPI) ; ils restent vérifiés, mais sans
# exiger l'annotation de chaque signature. À resserrer module par module.
# --------------------------------------------------------------------------- #
[[tool.mypy.overrides]]
module = [
    "lfm2_audio.vllm_plugin.*",
    "lfm2_audio.training.*",
    "lfm2_audio.orchestrator.*",
    "lfm2_audio.tools.*",
    "lfm2_audio.data_prep.*",
    "lfm2_audio.rag.*",
    "lfm2_audio.cli.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
disallow_untyped_decorators = false
warn_return_any = false
# Hériter de `nn.Module`, `Trainer` ou d'une classe vLLM non typée.
disallow_subclassing_any = false

# Le plugin manipule des attributs torch que les stubs ne savent pas exprimer
# (`nn.Module` rangé dans un attribut typé Tensor, overrides de classes vLLM
# non publiées). Ces codes ne sont fiables ici qu'avec torch installé — ce que
# l'env de dev local n'avait pas jusqu'ici — et signalent surtout du bruit.
[[tool.mypy.overrides]]
module = ["lfm2_audio.vllm_plugin.*"]
disable_error_code = ["operator", "assignment", "arg-type", "union-attr", "override"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "gpu: tests nécessitant un GPU et les checkpoints (désélectionnés par défaut : -m 'not gpu')",
]

[tool.coverage.run]
source = ["python/lfm2_audio"]
omit = ["*/cli/**", "*/vllm_plugin/*"]
