[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s2s-toolcalling"
version = "0.1.0"
description = "Phases 2 & 3 : fine-tuning FR + tool calling de LFM2.5-Audio et orchestrateur d'outils (accueil entreprise, Reachy Mini)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Fine-tuning (Phase 2) — liquid-audio impose Python >= 3.12
train = [
    "liquid-audio>=1.3.0",
    "peft>=0.13",
    "accelerate>=1.0",
    "datasets>=3.0",
    "safetensors>=0.4",
    "soundfile>=0.12",
    "torchaudio>=2.4",
    "transformers>=4.55",
]
# Orchestrateur temps réel (Phase 3)
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13.0",
    "asyncpg>=0.29",
    "numpy>=1.26",
]
# RAG projets (Phase 3)
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
